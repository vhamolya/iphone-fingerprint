[project]
name = "iphone-fingerprint"
version = "0.1.0"
description = "Which iPhone took this photo? Camera-sensor fingerprints (PRNU) in one small module."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vladyslav Hamolia" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "pywavelets>=1.5",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["fingerprint.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
